services:
  - type: web
    name: minilinkify-api
    runtime: docker
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PORT
        value: 8080
      - key: JAVA_OPTS
        value: "-Xmx400m -XX:MaxMetaspaceSize=100m"
    healthCheckPath: /actuator/health

databases:
  - name: minilinkify-db
    databaseName: minilinkify
    plan: free
